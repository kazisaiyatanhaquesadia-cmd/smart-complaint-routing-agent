<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <h1>Admin Login</h1>
        <p class="subtitle">Smart AI Complaint Routing Agent</p>

        <div class="result">
            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

                <br><br>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

                <br><br>

                <button type="submit">Login</button>

            </form>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}
        </div>

        <a href="/" class="clear-button">Back to Home</a>

    </div>
</body>
</html>
