
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Office Admin Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Office Admin Login</h1>

        <p class="subtitle">
            Smart AI Complaint Routing Agent
        </p>

        <div class="result">

            <h2>Admin Authentication</h2>

            <p class="subtitle">
                Login using your assigned office admin account.
            </p>

            <form method="POST">

                <div style="margin: 15px 0; text-align: left;">

                    <label for="username">
                        <strong>Username</strong>
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                        style="display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 12px;"
                    >

                </div>

                <div style="margin: 15px 0; text-align: left;">

                    <label for="password">
                        <strong>Password</strong>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        style="display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 12px;"
                    >

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            {% if error %}

                <p style="color: red; margin-top: 15px;">
                    {{ error }}
                </p>

            {% endif %}

        </div>

        <a href="/" class="clear-button">
            Back to Home
        </a>

    </div>

</body>
</html>
