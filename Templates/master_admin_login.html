
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3e8dc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fffaf5;
            padding: 40px 35px;
            border-radius: 15px;
            border: 1px solid #c8a98b;
            box-shadow: 0 8px 25px rgba(74, 45, 25, 0.15);
            text-align: center;
        }

        h1 {
            color: #5d3825;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8b6b55;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #65452f;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #c5a58a;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: #fffdfb;
            color: #4b3020;
        }

        input:focus {
            border-color: #75472d;
            box-shadow: 0 0 5px rgba(117, 71, 45, 0.2);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6b422c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-button:hover {
            background: #4f2f20;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border: 1px solid #8b6247;
            border-radius: 8px;
            background: #e8d5c3;
            color: #5d3825;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #d6b99f;
            color: #3f281b;
        }

        .error-message {
            background: #f1d9d2;
            color: #713b2c;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <h1>Master Admin Login</h1>

        <p class="subtitle">Smart AI Complaint Routing Agent</p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back-button">
            ← Back to Home
        </a>

    </div>

</body>
</html>
